<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="author" content="Vincent Otis Kisia (github.com/otis-ke)">
    <link rel="author" href="https://github.com/otis-ke">
    <!-- Built by Vincent Otis Kisia — https://github.com/otis-ke -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L&C Admin · Login</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="admin.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V5PZ8ZZ4TS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V5PZ8ZZ4TS');
  </script>
  <style>
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(1200px 600px at 20% -10%, #24413a 0%, transparent 60%),
                  radial-gradient(1000px 500px at 100% 100%, #3a2f18 0%, transparent 55%),
                  #10151a;
    }
    .auth {
      width: 100%; max-width: 420px;
      background: var(--surface); border-radius: 18px;
      box-shadow: var(--shadow-lg); overflow: hidden;
    }
    .auth__head { text-align: center; padding: 30px 28px 10px; }
    .auth__head img { width: 58px; height: 58px; border-radius: 14px; object-fit: cover; box-shadow: var(--shadow-sm); }
    .auth__head h1 { font-size: 20px; margin: 14px 0 2px; }
    .auth__head p { margin: 0; color: var(--ink-soft); font-size: 13.5px; }
    .tabs { display: flex; gap: 6px; padding: 18px 24px 0; }
    .tab {
      flex: 1; text-align: center; padding: 10px; cursor: pointer;
      font-weight: 600; font-size: 14px; color: var(--ink-soft);
      border-radius: 10px 10px 0 0; border-bottom: 2px solid transparent; transition: .15s;
    }
    .tab.active { color: var(--brand); border-bottom-color: var(--brand); background: var(--brand-light); }
    .pane { display: none; padding: 22px 24px 28px; }
    .pane.active { display: block; animation: fade .2s ease; }
    .pw-wrap { position: relative; }
    .pw-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      border: none; background: none; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600;
    }
    .alert { display: none; background: #fdecec; color: var(--danger-dark); border: 1px solid #f5c2c2;
      padding: 10px 12px; border-radius: 9px; font-size: 13px; margin-bottom: 14px; }
    .alert.show { display: block; }
    .ok { display: none; background: var(--brand-light); color: var(--brand-dark); border: 1px solid #bfe6cd;
      padding: 12px; border-radius: 9px; font-size: 14px; text-align: center; margin-top: 14px; }
    .ok.show { display: block; }
    .auth__foot { text-align: center; padding: 14px; border-top: 1px solid var(--line); font-size: 13px; }
    .auth__foot a { color: var(--brand); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="auth">
    <div class="auth__head">
      <img src="logo.png" alt="L&C">
      <h1>L&amp;C Admin Portal</h1>
      <p>Sign in to manage your website</p>
    </div>

    <div class="tabs">
      <div class="tab active" id="login-tab">Login</div>
      <div class="tab" id="signup-tab">Sign Up</div>
    </div>

    <!-- Login -->
    <div class="pane active" id="login-pane">
      <form id="login">
        <div class="alert" id="login-error">Invalid username or password.</div>
        <div class="field">
          <label for="username-email">Username or email</label>
          <input class="input" type="text" id="username-email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input class="input" type="password" id="password" required placeholder="••••••••">
            <button type="button" class="pw-toggle" id="pw-toggle">Show</button>
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="login-btn">Login</button>
      </form>
    </div>

    <!-- Sign up -->
    <div class="pane" id="signup-pane">
      <form id="contact-form">
        <div class="field"><label for="name">Full name</label><input class="input" id="name" required placeholder="Jane Doe"></div>
        <div class="field"><label for="email">Email address</label><input class="input" type="email" id="email" required placeholder="jane@example.com"></div>
        <div class="field"><label for="telephone">Telephone</label><input class="input" type="tel" id="telephone" required placeholder="+254 7xx xxx xxx"></div>
        <div class="field">
          <label for="membership">I'm interested in</label>
          <select class="select" id="membership" required>
            <option value="Membership">Membership</option>
            <option value="Sponsorship">Sponsorship</option>
            <option value="Partnership">Partnership</option>
            <option value="Student Sign Up">Student Sign Up</option>
          </select>
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="signup-btn">Submit</button>
        <div class="ok" id="success-message">✅ Thank you! We'll be in touch shortly.</div>
      </form>
    </div>

    <div class="auth__foot"><a href="index.html">← Back to website</a></div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script>
    (function () { emailjs.init("dsXzYWYxtQEg1cUPx"); })();
    const $ = (id) => document.getElementById(id);

    function toast(msg, type = "success") {
      const el = document.createElement("div");
      el.className = "toast toast--" + type;
      el.textContent = msg;
      $("toasts").appendChild(el);
      setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(() => el.remove(), 300); }, 3000);
    }

    // Tabs
    const loginTab = $("login-tab"), signupTab = $("signup-tab");
    const loginPane = $("login-pane"), signupPane = $("signup-pane");
    loginTab.addEventListener("click", () => {
      loginTab.classList.add("active"); signupTab.classList.remove("active");
      loginPane.classList.add("active"); signupPane.classList.remove("active");
    });
    signupTab.addEventListener("click", () => {
      signupTab.classList.add("active"); loginTab.classList.remove("active");
      signupPane.classList.add("active"); loginPane.classList.remove("active");
    });

    // Show / hide password
    $("pw-toggle").addEventListener("click", () => {
      const pw = $("password");
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      $("pw-toggle").textContent = show ? "Hide" : "Show";
    });

    // Login (client-side check — same as before)
    $("login").addEventListener("submit", (e) => {
      e.preventDefault();
      $("login-error").classList.remove("show");
      const id = $("username-email").value.trim();
      const pw = $("password").value;
      const validUsers = [
        { email: "admin", password: "LCmodeling12" },
        { email: "modellinglc@gmail.com", password: "LCmodeling12" }
      ];
      const ok = validUsers.find(u => u.email === id && u.password === pw);
      const btn = $("login-btn");
      if (ok) {
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in…';
        setTimeout(() => { window.location.href = "admin.html"; }, 500);
      } else {
        $("login-error").classList.add("show");
      }
    });

    // Sign-up via EmailJS
    $("contact-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const btn = $("signup-btn");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Sending…';
      const params = {
        to_name: "L&C Team",
        from_name: $("name").value,
        email: $("email").value,
        telephone: $("telephone").value,
        message: "Selected option: " + $("membership").value
      };
      emailjs.send("service_hw70pzw", "template_rqn75wb", params)
        .then(() => {
          $("contact-form").reset();
          $("success-message").classList.add("show");
          toast("Message sent!");
          setTimeout(() => $("success-message").classList.remove("show"), 5000);
        })
        .catch(() => toast("Failed to send. Please try again.", "error"))
        .finally(() => { btn.disabled = false; btn.textContent = "Submit"; });
    });
  </script>
</body>
</html>
