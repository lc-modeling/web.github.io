<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Responsive meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diversity &amp; Inclusivity Management</title>
    <style>
      /* Basic Reset */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        padding: 20px;
      }
      /* Header Bar */
      .header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .header-bar h1 {
        font-size: 24px;
        color: #333;
      }
      #addImageBtn {
        padding: 10px 20px;
        font-size: 16px;
        border: 2px dashed #007BFF;
        background: transparent;
        color: #007BFF;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      #addImageBtn:hover {
        background-color: rgba(0, 123, 255, 0.1);
      }
      /* Table Container */
      .table-container {
        background-color: #000;
        padding: 10px;
        border-radius: 8px;
        overflow-x: auto;
      }
      /* Table Styles */
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 600px;
      }
      th, td {
        text-align: left;
        padding: 16px;
        border-bottom: 1px solid #333;
        color: #fff;
        font-size: 16px;
        white-space: nowrap;
      }
      th {
        background-color: #2c2c2c;
        font-weight: 600;
      }
      td {
        background-color: #1f1f1f;
      }
      /* Thumbnail Styles */
      .thumbnail {
        max-width: 80px;
        max-height: 80px;
        border-radius: 4px;
        object-fit: cover;
      }
      /* Action Buttons */
      .actions button {
        margin-right: 8px;
        padding: 8px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      .actions .deleteBtn {
        background-color: #d9534f;
        color: #fff;
      }
      /* Modal Styles */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        width: 100%;
        max-width: 500px;
        position: relative;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      }
      .modal h2 {
        margin-bottom: 20px;
      }
      .modal .close {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 28px;
        cursor: pointer;
      }
      .modal form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .modal form input[type="file"],
      .modal form input[type="text"] {
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .modal form button {
        padding: 10px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .modal form .cancelBtn {
        background-color: #ccc;
        color: #333;
      }
      .modal form .saveBtn {
        background-color: #007BFF;
        color: #fff;
      }
      /* Header image preview in modal */
      #headerImagePreview img {
        max-width: 100%;
        max-height: 200px;
        border-radius: 4px;
        object-fit: cover;
        margin-top: 8px;
      }
      /* Responsive Adjustments */
      @media (max-width: 600px) {
        .header-bar h1 {
          font-size: 20px;
        }
        #addImageBtn {
          padding: 12px;
          font-size: 16px;
        }
        th, td {
          padding: 12px;
          font-size: 14px;
        }
        .thumbnail {
          max-width: 60px;
          max-height: 60px;
        }
        .actions button {
          padding: 6px 8px;
          font-size: 12px;
        }
      }
    </style>
    <link rel="stylesheet" href="../admin.css" />
    <style>
      body{font-family:"Outfit",-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding:26px 30px 60px;}
      .header-bar{margin-bottom:24px;align-items:flex-start;}
      .header-bar__left{display:flex;flex-direction:column;gap:6px;}
      .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--brand);text-decoration:none;font-weight:600;font-size:13.5px;}
      .back-link svg{width:16px;height:16px;}
      .back-link:hover{text-decoration:underline;}
      .header-bar h1{font-size:24px;color:var(--ink);font-weight:700;}
      #addModelBtn,#addImageBtn,#addPostBtn{display:inline-flex;align-items:center;gap:6px;border:none;background:var(--brand);color:#fff;padding:11px 18px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-sm);transition:background .15s;}
      #addModelBtn:hover,#addImageBtn:hover,#addPostBtn:hover{background:var(--brand-dark);}
      .models-container{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
      table th{background:#fafbfc !important;color:var(--ink-soft) !important;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line) !important;}
      table td{background:var(--surface) !important;color:var(--ink) !important;border-bottom:1px solid var(--line) !important;}
      .thumbnail,.additional-images-container img,.preview-slider img,.header-preview img{border-radius:8px;}
      .editBtn{background:#eef2f7 !important;color:var(--ink) !important;border-radius:8px;font-weight:600;}
      .deleteBtn{background:var(--danger) !important;color:#fff !important;border-radius:8px;font-weight:600;}
      .modal{border-radius:16px;box-shadow:var(--shadow-lg);padding:24px;max-width:600px;}
      .modal h2{font-size:19px;}
      .modal .close{color:var(--muted);}
      .modal form input,.modal form textarea,.modal form select{border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14px;}
      .modal form input:focus,.modal form textarea:focus,.modal form select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,143,78,.15);}
      .saveBtn,#saveBtn{background:var(--brand) !important;color:#fff !important;border-radius:10px;font-weight:600;border:none;padding:11px 18px;cursor:pointer;}
      .saveBtn:hover,#saveBtn:hover{background:var(--brand-dark) !important;}
      .cancelBtn{background:#eef2f7 !important;color:var(--ink) !important;border-radius:10px;font-weight:600;border:none;padding:11px 18px;cursor:pointer;}
    </style>
  </head>
  <body>
    <!-- Header Bar -->
    <div class="header-bar">
      <div class="header-bar__left">
        <a class="back-link" href="../admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Dashboard</a>
        <h1>Diversity &amp; Inclusivity</h1>
      </div>
      <button id="addImageBtn">+ Add New Image</button>
    </div>

    <!-- Table Container -->
    <div class="table-container">
      <table id="imagesTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Header Image</th>
            <th>Time</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Diversity images will be populated here dynamically -->
        </tbody>
      </table>
    </div>

    <!-- Modal for Adding a New Image -->
    <div id="modalOverlay" class="modal-overlay">
      <div class="modal">
        <span id="closeModal" class="close">&times;</span>
        <h2>Add Diversity Image</h2>
        <form id="diversityForm">
          <label>Select Header Image:</label>
          <input type="file" id="headerImage" accept="image/*" required />
          <!-- Header image preview -->
          <div id="headerImagePreview"></div>
          <div style="display: flex; gap: 10px;">
            <button type="submit" class="saveBtn" id="saveBtn">Save Image</button>
            <button type="button" class="cancelBtn" id="cancelBtn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Firebase and Cloudinary Scripts -->
    <script type="module">
      // Firebase setup
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { 
        getFirestore, collection, getDocs, query, orderBy, addDoc, deleteDoc, doc, serverTimestamp
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAxauEEtqkuJOWA9HRe1jpT_wCXH62nksM",
        authDomain: "schoolcms-77713.firebaseapp.com",
        projectId: "schoolcms-77713",
        storageBucket: "schoolcms-77713.appspot.com",
        messagingSenderId: "757700374571",
        appId: "1:757700374571:web:a86b334d619cf160fa7a6e"
      };

      const app = initializeApp(firebaseConfig);
      const firestore = getFirestore(app);
      const diversityCollection = collection(firestore, "diversity_and_inclusivity");

      // Cloudinary configuration for image uploads
      const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dwlasndqv/upload";
      const CLOUDINARY_UPLOAD_PRESET = "quranpilot";

      // Helper function to upload file to Cloudinary
      async function uploadToCloudinary(file) {
        const formData = new FormData();
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
        formData.append("file", file);
        const response = await fetch(CLOUDINARY_URL, {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        if (response.ok) {
          return data.secure_url;
        } else {
          throw new Error(data.error?.message || "Upload failed");
        }
      }

      // Function to fetch and display diversity images in table layout
      async function displayDiversityImages() {
        try {
          const diversityQuery = query(diversityCollection, orderBy("time", "desc"));
          const snapshot = await getDocs(diversityQuery);
          const tableBody = document.querySelector("#imagesTable tbody");
          tableBody.innerHTML = "";
          snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const row = document.createElement("tr");

            // ID cell
            const idCell = document.createElement("td");
            idCell.textContent = docSnap.id;
            row.appendChild(idCell);

            // Header Image cell
            const headerCell = document.createElement("td");
            if (data.header_image) {
              const img = document.createElement("img");
              img.src = data.header_image;
              img.alt = "Diversity Image";
              img.className = "thumbnail";
              headerCell.appendChild(img);
            }
            row.appendChild(headerCell);

            // Time cell (formatted)
            const timeCell = document.createElement("td");
            if (data.time) {
              const dateObj = data.time.toDate ? data.time.toDate() : new Date(data.time);
              timeCell.textContent = dateObj.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
            }
            row.appendChild(timeCell);

            // Actions cell
            const actionsCell = document.createElement("td");
            actionsCell.className = "actions";
            const deleteBtn = document.createElement("button");
            deleteBtn.className = "deleteBtn";
            deleteBtn.textContent = "Delete";
            deleteBtn.addEventListener("click", async () => {
              if (confirm("Are you sure you want to delete this image?")) {
                await deleteDoc(doc(firestore, "diversity_and_inclusivity", docSnap.id));
                displayDiversityImages();
              }
            });
            actionsCell.appendChild(deleteBtn);
            row.appendChild(actionsCell);

            tableBody.appendChild(row);
          });
        } catch (error) {
          console.error("Error fetching diversity images:", error);
          document.querySelector("#imagesTable tbody").innerHTML = "<tr><td colspan='4' style='color:#fff;'>Error loading images.</td></tr>";
        }
      }

      // Modal form elements
      const addImageBtn = document.getElementById("addImageBtn");
      const modalOverlay = document.getElementById("modalOverlay");
      const closeModalEl = document.getElementById("closeModal");
      const cancelBtn = document.getElementById("cancelBtn");
      const diversityForm = document.getElementById("diversityForm");
      const headerImageInput = document.getElementById("headerImage");
      const headerImagePreview = document.getElementById("headerImagePreview");
      const saveBtn = document.getElementById("saveBtn");

      // Update header image preview in modal
      function updateHeaderImagePreview(fileOrUrl) {
        headerImagePreview.innerHTML = "";
        const img = document.createElement("img");
        if (fileOrUrl instanceof File) {
          const reader = new FileReader();
          reader.onload = function(e) {
            img.src = e.target.result;
          };
          reader.readAsDataURL(fileOrUrl);
        } else if (fileOrUrl) {
          img.src = fileOrUrl;
        }
        headerImagePreview.appendChild(img);
      }
      headerImageInput.addEventListener("change", () => {
        if (headerImageInput.files.length > 0) {
          updateHeaderImagePreview(headerImageInput.files[0]);
        } else {
          headerImagePreview.innerHTML = "";
        }
      });

      // Modal open/close functions
      function openModal() {
        modalOverlay.style.display = "flex";
      }
      function closeModal() {
        modalOverlay.style.display = "none";
        diversityForm.reset();
        headerImagePreview.innerHTML = "";
      }
      addImageBtn.addEventListener("click", openModal);
      closeModalEl.addEventListener("click", closeModal);
      cancelBtn.addEventListener("click", closeModal);

      // Form submission: upload image and add new document
      diversityForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";
        try {
          if (headerImageInput.files.length === 0) {
            alert("Please select an image.");
            return;
          }
          // Upload header image to Cloudinary
          const headerImageUrl = await uploadToCloudinary(headerImageInput.files[0]);
          // Add new document to Firestore with header_image and current timestamp
          await addDoc(diversityCollection, {
            header_image: headerImageUrl,
            time: serverTimestamp()
          });
          alert("Image added successfully!");
          displayDiversityImages();
          closeModal();
        } catch (error) {
          console.error("Error saving image:", error);
          alert("Error saving image. Please try again.");
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = "Save Image";
        }
      });

      // Initial load of diversity images
      displayDiversityImages();
    </script>
  </body>
</html>
